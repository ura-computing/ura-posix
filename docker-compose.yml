# Local demo stack for apcm-refactor.
#
# `make demo` brings this up. Postgres 17 everywhere (dev, demo, E2E) — the
# same major version as production on DigitalOcean. Its data lives in the
# `pg17_data` volume; the old Postgres 16 volume `postgres_data` is only read
# once by scripts/pg16-to-17.sh (service `db16` below). The backend's
# entrypoint runs `alembic upgrade head` and seeds admin/owner/catalogue if
# not already present.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-apcm_demo}
      POSTGRES_USER:     ${POSTGRES_USER:-apcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apcm}
    # Bound to 127.0.0.1 so `make backend` (host-side uvicorn) can connect
    # using the dev DATABASE_URL (.../localhost:5432/apcm). Demo mode still
    # uses the docker-network hostname `db` for the containerized backend.
    # If a client also has apcm-pharma's stack running on 5432, they should
    # `docker compose down` it before running this one.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg17_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apcm} -d ${POSTGRES_DB:-apcm_demo}"]
      interval: 5s
      timeout:  5s
      retries:  10
    restart: unless-stopped

  # One-time only: opens the old Postgres 16 volume so scripts/pg16-to-17.sh
  # can copy it into Postgres 17. Profile `pg16` → never started by
  # `make db` / `make demo`. No port (the 17 `db` owns 5432).
  db16:
    image: postgres:16
    profiles: ["pg16"]
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-apcm_demo}
      POSTGRES_USER:     ${POSTGRES_USER:-apcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apcm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-apcm} -d ${POSTGRES_DB:-apcm_demo}"]
      interval: 5s
      timeout:  5s
      retries:  10

  backend:
    build: ./backend
    environment:
      # Driver explicitly named — refactor's config.py uses psycopg2.
      DATABASE_URL:          postgresql+psycopg2://${POSTGRES_USER:-apcm}:${POSTGRES_PASSWORD:-apcm}@db:5432/${POSTGRES_DB:-apcm_demo}
      JWT_SECRET:            ${JWT_SECRET:-demo-jwt-secret-not-for-prod-32chars-min!!}
      JWT_ACCESS_EXPIRY_MIN: ${JWT_ACCESS_EXPIRY_MIN:-10080}
      COOKIE_SECURE:         ${COOKIE_SECURE:-false}
      FRONTEND_URL:          ${FRONTEND_URL:-http://localhost:4173}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:         ["CMD-SHELL", "curl -fsS http://localhost:8000/v1/health || exit 1"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Vite bundle at build time — must point to where the
        # browser will reach the backend (localhost from the host, not `db` or
        # `backend` which are docker-network hostnames).
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:8000}
    ports:
      - "4173:4173"
    restart: unless-stopped

volumes:
  pg17_data:
  postgres_data:      # old Postgres 16 data — kept as a backup, read only by db16
