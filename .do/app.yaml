# DigitalOcean App Platform — deploy PharmaGest
# https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: pharmagest

databases:
  - name: pharmagest-db
    engine: PG
    version: "16"
    size: db-s-1vcpu-1gb
    num_nodes: 1

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - name: pharmagest-api
    dockerfile_path: backend/Dockerfile
    source_dir: backend
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${pharmagest-db.DATABASE_URL}
      - key: SECRET_KEY
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_GENERATE_A_RANDOM_STRING
      - key: APP_ENV
        scope: RUN_TIME
        value: prod
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: CORS_ORIGINS
        scope: RUN_TIME
        value: ${APP_URL}

  # ── Frontend (React static site) ───────────────────────────────────────────
static_sites:
  - name: pharmagest-web
    dockerfile_path: frontend/Dockerfile
    source_dir: frontend
    routes:
      - path: /
    environment_slug: node-js
    build_command: npm install --legacy-peer-deps && npm run build
    output_dir: dist
    catchall_document: index.html
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${pharmagest-api.PUBLIC_URL}
      - key: VITE_BACKEND_BASE_URL
        scope: BUILD_TIME
        value: ${pharmagest-api.PUBLIC_URL}/
