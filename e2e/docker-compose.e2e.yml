# E2E stack = the production images on Postgres 17, like DigitalOcean:
#   backend  → backend/Dockerfile → entrypoint.sh (migrations, seed, uvicorn main:app, 2 workers)
#   worker   → the same image, entrypoint.sh worker (the Sobrus robot, DigitalOcean « Worker » component)
#   frontend → frontend/Dockerfile → production build served by `serve`
# Isolated from dev: own project (apcm-e2e), own ports, database in memory (fresh every run).
# Started and removed by e2e/scripts/start-stack.sh (Playwright webServer).
name: apcm-e2e

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: apcm_e2e
      POSTGRES_USER: apcm
      POSTGRES_PASSWORD: apcm
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apcm -d apcm_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ../backend
    environment: &backend_env
      DATABASE_URL: postgresql+psycopg2://apcm:apcm@db:5432/apcm_e2e
      JWT_SECRET: e2e-jwt-secret-only-for-the-test-stack-0123456789
      FRONTEND_URL: http://localhost:5174
      COOKIE_SECURE: "false"
      MAIL_USERNAME: "" # no SMTP: magic links are printed to the log (e2e/lib/mail.ts)
      SEED_CATALOG: "0" # catalogue = generated products only (every value known to the oracle)
      PRODUCT_INFOS_FILE: /app/data/product-infos.e2e.json # photos of a few generated products
      RATE_LIMIT: "0" # the suite logs in more than 5 times a minute
      PORT: "8001"
      PYTHONUNBUFFERED: "1"
      # « Connexion Sobrus » against the fake Sobrus below, never the real one; the robot = the `worker`
      # service below (app/sobrus/worker.py), its key derived from JWT_SECRET (as in production).
      SOBRUS_API_URL: &sobrus_url http://sobrus.e2e.test:9100
      SOBRUS_ACCOUNT_API_URL: *sobrus_url
      SOBRUS_BUSY_WAITS: "1,1" # Sobrus 429: the robot waits 1 s then 1 s (production: 60 s then 300 s)
    volumes:
      - ../resources/tests/catalog/product-infos.json:/app/data/product-infos.e2e.json:ro
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      fake-sobrus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8001/v1/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 10s

  # The Sobrus robot, its own container (as on DigitalOcean): same image and settings as the API, started
  # once the API is up (migrations done); its emails go to the log like the API's (e2e/lib/mail.ts).
  worker:
    build: ../backend
    command: ["./entrypoint.sh", "worker"]
    environment: *backend_env
    depends_on:
      backend:
        condition: service_healthy

  # Fake Sobrus (e2e/fake-sobrus/server.py): the 5 HTTP steps of the real login + its exports, serving
  # the generated CSVs. Port 19100 on the host (9100 is often taken there: Prometheus node_exporter) = the specs'
  # `/__control` (« password changed »).
  fake-sobrus:
    image: python:3.12-slim
    command: ["python", "/srv/server.py"]
    environment:
      FAKE_SOBRUS_EMAIL: pharmacie@sobrus.e2e
      FAKE_SOBRUS_PASSWORD: SobrusE2e#2026
      FAKE_SOBRUS_DATA: /data
      FAKE_SOBRUS_BASE: http://sobrus.e2e.test:9100
      PORT: "9100"
    volumes:
      - ./fake-sobrus/server.py:/srv/server.py:ro
      - ../resources/tests:/data:ro
    ports:
      - "127.0.0.1:19100:9100"
    networks:
      default:
        aliases: [sobrus.e2e.test]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/login')"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ../frontend
      args:
        VITE_BACKEND_URL: http://localhost:8001 # read at build time, like production
    ports:
      - "127.0.0.1:5174:4173"
    # Starts once the API answers: Playwright waits for this app, so « app up » = whole stack up.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4173/ || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
