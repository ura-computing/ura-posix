[project]
name = "pharmagest-backend"
version = "0.1.0"
description = "PharmaGest — pharmacy management backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.138.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "bcrypt>=4.1",
    "python-jose[cryptography]>=3.3",
    "pydantic[email]>=2.6",
    "questionary>=2.1.1",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# All tests must execute against a separate database so they don't trample
# the dev DB. conftest.py reads APCM_TEST_DATABASE_URL or falls back to a
# `_test` suffix on the dev URL.
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
