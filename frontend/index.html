<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmaGest</title>
    <!-- Apply theme BEFORE React mounts so every route (including /404 and
         auth screens, which live outside AppLayout) renders with the right
         theme on refresh — and no FOUC. Mirrors useTheme.ts's resolveDark. -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("pg-theme") || "system";
          var dark = mode === "dark"
            || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (_) { /* localStorage disabled — ignore, default light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
