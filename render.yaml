# Render Blueprint — deploy PharmaGest with one click
# https://render.com/docs/blueprint-spec

databases:
  - name: pharmagest-db
    plan: free
    databaseName: pharmagest
    user: pharmagest

services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: pharmagest-api
    plan: free
    runtime: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmagest-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.12"

  # ── Frontend (React static site) ───────────────────────────────────────────
  - type: web
    name: pharmagest-web
    runtime: static
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: dist
    rootDir: frontend
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_BACKEND_BASE_URL
        sync: false
